name: Publish website

on:
  push:
    branches: [main]
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check feed parser and build
        run: python3 -m unittest discover -s tests -v
      - name: Update Telegram feed
        id: telegram
        continue-on-error: true
        run: python3 scripts/update_feed.py
      - name: Retain the latest feed for future builds
        if: steps.telegram.outcome == 'success'
        continue-on-error: true
        run: |
          if ! git diff --quiet -- feed.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add feed.json
            git commit -m 'Update Telegram feed'
            git push origin HEAD:main
          fi
      - name: Build static site
        run: python3 scripts/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
